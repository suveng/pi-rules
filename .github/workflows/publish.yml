name: publish

# 触发：推 v* 标签，或在 Actions 页面手动 Run workflow（workflow_dispatch）
# 鉴权走 npm Trusted Publisher（OIDC），仓库内不放任何 NPM_TOKEN。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 换 npm 发布令牌，缺了会 403

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # npm 的 OIDC 发布要求 npm >= 11.5.1
      - name: 升级 npm
        run: npm install -g npm@latest && npm --version

      - name: 校验包内容（零依赖，不需要 install）
        run: npm pack --dry-run

      - name: 发布到 npm（provenance 由 OIDC 签发）
        run: npm publish --provenance --access public
